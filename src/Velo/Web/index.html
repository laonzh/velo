<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="velo-token" content="__VELO_TOKEN__">
  <title>Velo</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <header>
    <h1>Velo</h1>
    <span id="counts"></span>
    <button id="refresh" type="button">刷新</button>
  </header>

  <main>
    <form id="add" class="add">
      <textarea id="add-prompt" rows="3" placeholder="任务描述（作为 Codex 的 prompt）" required></textarea>
      <div class="row">
        <input id="add-workspace" placeholder="工作目录（绝对路径）" required>
        <label><input id="add-worktree" type="checkbox"> 使用 Git worktree</label>
        <button type="submit">添加</button>
      </div>
    </form>

    <p id="message" role="status"></p>

    <section id="running"><h2>运行中</h2><div class="list"></div></section>
    <section id="pending"><h2>等待中</h2><div class="list"></div></section>
    <section id="failed"><h2>失败</h2><div class="list"></div></section>
    <section id="succeeded"><h2>已完成</h2><div class="list"></div></section>
  </main>

  <template id="row-template">
    <article class="work">
      <div class="head">
        <span class="badge"></span>
        <span class="title"></span>
      </div>
      <div class="meta"></div>
      <p class="error"></p>
      <div class="actions">
        <button type="button" data-action="edit">编辑</button>
        <button type="button" data-action="cancel">取消</button>
        <button type="button" data-action="retry">重试</button>
        <button type="button" data-action="log">日志</button>
        <button type="button" data-action="diff">查看 diff</button>
        <button type="button" data-action="accept">接受</button>
        <button type="button" data-action="discard">丢弃</button>
        <button type="button" data-action="delete">删除</button>
      </div>
      <form class="editor" hidden>
        <textarea rows="3" required></textarea>
        <div class="actions">
          <button type="submit">保存</button>
          <button type="button" data-action="close-editor">放弃</button>
        </div>
      </form>
      <pre class="log" hidden></pre>
      <pre class="diff" hidden></pre>
    </article>
  </template>

  <script src="/dashboard.js"></script>
</body>
</html>
